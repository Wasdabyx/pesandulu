<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelanggan - PesanDulu</title>
  <meta name="theme-color" content="#14452a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/PlusJakartaSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="stylesheet" href="css/tabel-susun.css?v=8" media="(max-width: 640px)">
</head>
<body>
  <header class="kepala">
    <div class="lebar luas navigasi">
      <a class="merek" href="index.html">Pesan<span>Dulu</span></a>
      <nav aria-label="Halaman penjual">
        <a href="dashboard-penjual.html">Dashboard</a>
        <a href="antrean-pesanan.html">Pesanan</a>
        <a href="kelola-menu.html">Menu</a>
        <a href="daftar-pelanggan.html" aria-current="page">Pelanggan</a>
      </nav>
      <button type="button" class="tombol-kepala tombol-logout">Logout</button>
    </div>
  </header>

  <main class="lebar luas isi">
    <section class="kartu" aria-labelledby="judul-daftar">
      <div class="judul-bagian">
        <h1 id="judul-daftar">Pelanggan</h1>
        <input id="isian-cari" class="isian-cari" type="search" placeholder="Cari nama / no. HP" aria-label="Cari nama atau nomor HP" autocomplete="off">
      </div>
      <p id="pesan-daftar" class="pesan" role="status">Memuat pelanggan…</p>
      <table class="tabel">
        <thead>
          <tr>
            <th scope="col">Nama</th>
            <th scope="col">No. HP</th>
          </tr>
        </thead>
        <tbody id="badan-tabel-pelanggan"></tbody>
      </table>
      <p id="daftar-kosong" class="keterangan" hidden></p>
    </section>
  </main>

  <template id="templat-baris-pelanggan">
    <tr>
      <td class="sel-nama"></td>
      <td class="sel-no-hp" data-label="No. HP"></td>
    </tr>
  </template>

  <script src="js/config.js?v=8"></script>
  <script src="js/umum.js?v=8"></script>
  <script src="js/daftar-pelanggan.js?v=8"></script>
</body>
</html>
