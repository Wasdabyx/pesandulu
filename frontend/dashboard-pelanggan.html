<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - PesanDulu</title>
  <meta name="theme-color" content="#14452a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/PlusJakartaSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="ada-navigasi-bawah">
  <header class="kepala">
    <div class="lebar sempit navigasi">
      <a class="merek" href="index.html">Pesan<span>Dulu</span></a>
    </div>
  </header>

  <main class="lebar sempit isi">
    <section class="kartu" aria-labelledby="judul-dashboard">
      <h1 id="judul-dashboard">Dashboard</h1>
      <p id="sapaan" class="keterangan"></p>
      <p id="pesan-dashboard" class="pesan" role="status">Memuat dashboard…</p>
      <div id="ringkasan" class="ringkasan" hidden>
        <div class="kotak-angka" data-status="menunggu"><span class="angka"></span><span class="nama-angka">Menunggu</span></div>
        <div class="kotak-angka" data-status="diproses"><span class="angka"></span><span class="nama-angka">Diproses</span></div>
        <div class="kotak-angka" data-status="siap diambil"><span class="angka"></span><span class="nama-angka">Siap diambil</span></div>
        <div class="kotak-angka" data-status="selesai"><span class="angka"></span><span class="nama-angka">Selesai</span></div>
      </div>
      <div class="tumpukan-tombol">
        <a class="tombol utama" href="buat-pesanan.html">Pesan Sekarang</a>
        <button type="button" class="tombol tombol-logout">Logout</button>
      </div>
    </section>

    <section class="kartu polos" aria-labelledby="judul-berjalan">
      <h2 id="judul-berjalan">Pesanan yang sedang berjalan</h2>
      <ul id="daftar-berjalan" class="daftar-pesanan"></ul>
      <p id="berjalan-kosong" class="keterangan tiket-kosong" hidden>Tidak ada pesanan yang sedang berjalan.</p>
      <p class="keterangan"><a href="pesanan-saya.html">Lihat semua pesanan</a></p>
    </section>
  </main>

  <nav class="navigasi-bawah" aria-label="Halaman pelanggan">
    <a href="dashboard-pelanggan.html" aria-current="page">Dashboard</a>
    <a href="buat-pesanan.html">Menu</a>
    <a href="pesanan-saya.html">Pesanan</a>
    <a href="profil.html">Profil</a>
  </nav>

  <template id="templat-pesanan">
    <li class="item-pesanan">
      <div class="tiket-atas">
        <div class="baris-pesanan">
          <span class="nomor-pesanan"></span>
          <span class="label-status"></span>
        </div>
        <p class="isi-pesanan"></p>
      </div>
      <div class="tiket-bawah">
        <p class="rincian-pesanan"><span class="bagian-ambil">Ambil <strong class="jam-ambil"></strong></span><span class="pemisah-rincian"> · </span><strong class="total-pesanan"></strong></p>
      </div>
    </li>
  </template>

  <script src="js/config.js?v=6"></script>
  <script src="js/umum.js?v=6"></script>
  <script src="js/dashboard-pelanggan.js?v=6"></script>
</body>
</html>
