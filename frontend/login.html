<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - PesanDulu</title>
  <meta name="theme-color" content="#14452a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/PlusJakartaSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="sambut">
  <header class="kepala">
    <div class="lebar sempit navigasi">
      <a class="merek" href="index.html">Pesan<span>Dulu</span></a>
    </div>
  </header>

  <main class="lebar sempit isi">
    <section class="kartu" aria-labelledby="judul-login">
      <h1 id="judul-login">Login</h1>
      <form id="formulir-login" class="formulir" hidden>
        <fieldset class="pilihan-peran">
          <legend>Login sebagai</legend>
          <label class="pilihan">
            <input type="radio" name="peran" value="pelanggan" autocomplete="off" checked>
            Pelanggan
          </label>
          <label class="pilihan">
            <input type="radio" name="peran" value="penjual" autocomplete="off">
            Penjual
          </label>
        </fieldset>

        <div id="kelompok-no-hp">
          <label for="isian-no-hp">No. HP</label>
          <input id="isian-no-hp" name="no_hp" type="tel" maxlength="20" autocomplete="username" required>
        </div>

        <label for="isian-kata-sandi">Kata sandi</label>
        <input id="isian-kata-sandi" name="kata_sandi" type="password" maxlength="64" autocomplete="current-password" required>

        <label class="pilihan">
          <input type="checkbox" class="tampilkan-sandi" data-untuk="isian-kata-sandi" autocomplete="off">
          Tampilkan kata sandi
        </label>

        <div class="tumpukan-tombol">
          <button type="submit" id="tombol-login" class="tombol utama">Login</button>
        </div>
      </form>
      <p id="pesan-login" class="pesan" role="status">Memeriksa sesi…</p>
      <p class="keterangan">Belum punya akun? <a href="register.html">Register</a></p>
    </section>
  </main>

  <script src="js/config.js?v=8"></script>
  <script src="js/umum.js?v=8"></script>
  <script src="js/login.js?v=8"></script>
</body>
</html>
