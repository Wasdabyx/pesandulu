<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesanan Saya - PesanDulu</title>
  <meta name="theme-color" content="#14452a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/PlusJakartaSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body class="ada-navigasi-bawah">
  <header class="kepala">
    <div class="lebar sempit navigasi">
      <a class="merek" href="index.html">Pesan<span>Dulu</span></a>
    </div>
  </header>

  <main class="lebar sempit isi">
    <section class="kartu polos" aria-labelledby="judul-pesanan">
      <h1 id="judul-pesanan">Pesanan Saya</h1>
      <p id="pesan-daftar" class="pesan" role="status">Memuat pesanan…</p>
      <p id="daftar-kosong" class="keterangan tiket-kosong" hidden>Belum ada pesanan. <a href="buat-pesanan.html">Lihat menu</a> untuk memesan.</p>
      <ul id="daftar-pesanan" class="daftar-pesanan"></ul>
    </section>
  </main>

  <nav class="navigasi-bawah" aria-label="Halaman pelanggan">
    <a href="dashboard-pelanggan.html">Dashboard</a>
    <a href="buat-pesanan.html">Menu</a>
    <a href="pesanan-saya.html" aria-current="page">Pesanan</a>
    <a href="profil.html">Profil</a>
  </nav>

  <template id="templat-pesanan">
    <li class="item-pesanan">
      <div class="tiket-atas">
        <div class="baris-pesanan">
          <span class="nomor-pesanan"></span>
          <span class="label-status"></span>
        </div>
        <p class="isi-pesanan"></p>
        <p class="catatan-pesanan" hidden></p>
        <p class="keterangan-batal" hidden></p>
        <p class="waktu-pesan" hidden></p>
      </div>
      <div class="tiket-bawah">
        <p class="rincian-pesanan"><span class="bagian-ambil">Ambil <strong class="jam-ambil"></strong></span><span class="pemisah-rincian"> · </span><strong class="total-pesanan"></strong></p>
        <button type="button" class="tombol kecil tombol-batalkan" hidden>Batalkan</button>
      </div>
    </li>
  </template>

  <script src="js/config.js?v=9"></script>
  <script src="js/umum.js?v=9"></script>
  <script src="js/pesanan-saya.js?v=9"></script>
</body>
</html>
