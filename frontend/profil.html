<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Saya - PesanDulu</title>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <header class="kepala ringkas">
    <div class="lebar sempit navigasi">
      <a class="merek" href="index.html">PesanDulu</a>
    </div>
  </header>

  <main class="lebar sempit isi">
    <section class="kartu" aria-labelledby="judul-profil">
      <h1 id="judul-profil">Profil Saya</h1>
      <p id="keterangan-profil" class="keterangan"></p>
      <form id="formulir-profil" class="formulir" hidden>
        <label for="isian-nama">Nama</label>
        <input id="isian-nama" name="nama" type="text" maxlength="50" autocomplete="name" required>

        <label for="isian-no-hp">No. HP (contoh: 081234567890)</label>
        <input id="isian-no-hp" name="no_hp" type="tel" maxlength="20" autocomplete="tel" required>

        <div class="tumpukan-tombol">
          <button type="submit" id="tombol-simpan" class="tombol utama">Simpan</button>
          <button type="button" id="tombol-hapus" class="tombol bahaya" hidden>Hapus Akun</button>
        </div>
      </form>
      <p id="pesan-profil" class="pesan" role="status">Memuat profil…</p>
    </section>
  </main>

  <script src="js/config.js?v=1"></script>
  <script src="js/umum.js?v=1"></script>
  <script src="js/profil.js?v=1"></script>
</body>
</html>
